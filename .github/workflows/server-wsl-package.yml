name: WSL external validation and draft preparation (temporary QA branch)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: External proof or draft-only artifact upload
        type: choice
        options: [external, draft, public-http]
        default: external
        required: true
      version:
        description: Name of the temporary protected QA payload secret
        required: true
permissions:
  contents: read
concurrency:
  group: wsl-external-validation
  cancel-in-progress: false
jobs:
  external:
    if: inputs.operation != 'draft' && inputs.operation != 'public-http'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated QA tool
        id: plan
        env:
          CASTLINK_WSL_EXTERNAL_QA: ${{ secrets[inputs.version] }}
        run: |
          mkdir -p "$RUNNER_TEMP/castlink-wsl-external"
          cp scripts/qa-wsl-external-proof.mjs "$RUNNER_TEMP/castlink-wsl-external/probe.mjs"
          node -e 'try{const fs=require("fs");const p=JSON.parse(process.env.CASTLINK_WSL_EXTERNAL_QA);if(!["connectivity","media"].includes(p.mode))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,"mode="+p.mode+"\n")}catch{console.error("QA plan unavailable");process.exit(1)}'
      - name: Install pinned browser QA dependencies
        if: steps.plan.outputs.mode == 'media'
        run: |
          npm install --prefix "$RUNNER_TEMP/castlink-wsl-external" --no-save --ignore-scripts --package-lock=false playwright@1.58.2 livekit-client@2.22.3
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          "$RUNNER_TEMP/castlink-wsl-external/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify external HTTPS and TURN
        working-directory: ${{ runner.temp }}/castlink-wsl-external
        env:
          CASTLINK_WSL_EXTERNAL_QA: ${{ secrets[inputs.version] }}
        run: node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castlink-wsl-external-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/castlink-wsl-external-proof.json
          if-no-files-found: ignore
          retention-days: 7
  draft-only:
    if: inputs.operation == 'draft'
    concurrency:
      group: castlink-draft-server-wsl-v1.0.2-rc.8-d9a0c6465b51
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download only the finished reviewed factory artifact
        uses: actions/download-artifact@v4
        with:
          repository: resokol/castlink
          run-id: 43256796399
          name: castlink-server-wsl-candidate-d9a0c6465b512562766fcb42726a59dcdf3fb5c2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/wsl-assets
      - name: Verify and reconcile draft-only release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/qa-wsl-draft-publisher.mjs
          .github/release-plans/server-wsl-rc8.json
          "$RUNNER_TEMP/wsl-assets"
          .github/release-notes/server-wsl-rc8.md
          "$RUNNER_TEMP/wsl-draft-proof.json"
      - name: Preserve small draft receipt
        uses: actions/upload-artifact@v4
        with:
          name: castlink-wsl-draft-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl-draft-proof.json
          if-no-files-found: error
          retention-days: 7
  public-route:
    if: inputs.operation == 'public-http'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe public DNS, HTTP challenge route and verified HTTPS
        run: node scripts/qa-node2-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node2-public-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node2-public-route-proof.json
          if-no-files-found: error
          retention-days: 7
