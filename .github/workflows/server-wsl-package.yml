name: WSL external validation (temporary QA branch)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Name of the temporary protected QA payload secret
        required: true
permissions:
  contents: read
concurrency:
  group: wsl-external-validation
  cancel-in-progress: false
jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated QA tool
        id: plan
        env:
          CASTLINK_WSL_EXTERNAL_QA: ${{ secrets[inputs.version] }}
        run: |
          mkdir -p "$RUNNER_TEMP/castlink-wsl-external"
          cp scripts/qa-wsl-external-proof.mjs "$RUNNER_TEMP/castlink-wsl-external/probe.mjs"
          node -e 'try{const fs=require("fs");const p=JSON.parse(process.env.CASTLINK_WSL_EXTERNAL_QA);if(!["connectivity","media"].includes(p.mode))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,"mode="+p.mode+"\n")}catch{console.error("QA plan unavailable");process.exit(1)}'
      - name: Install pinned browser QA dependencies
        if: steps.plan.outputs.mode == 'media'
        run: |
          npm install --prefix "$RUNNER_TEMP/castlink-wsl-external" --no-save --ignore-scripts --package-lock=false playwright@1.58.2 livekit-client@2.22.3
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          "$RUNNER_TEMP/castlink-wsl-external/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify external HTTPS and TURN
        working-directory: ${{ runner.temp }}/castlink-wsl-external
        env:
          CASTLINK_WSL_EXTERNAL_QA: ${{ secrets[inputs.version] }}
        run: node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castlink-wsl-external-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/castlink-wsl-external-proof.json
          if-no-files-found: ignore
          retention-days: 7
