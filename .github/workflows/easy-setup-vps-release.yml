name: Private Easy Setup VPS image and manifest (NO DEPLOYMENT)
on:
  workflow_dispatch:
  push:
    branches: [feat/self-hosted-cli-github]
    paths:
      - '.github/workflows/easy-setup-vps-release.yml'
      - 'Dockerfile.web'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
  packages: write
jobs:
  release-inputs:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Compile the manifest validator and registry observer
        run: |
          pnpm --filter @castlink/cli install --frozen-lockfile --ignore-scripts
          pnpm --filter @castlink/cli build
      - name: Select this private package and exact build
        id: coordinates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]
          BUILD_ID="${VERSION}-${GITHUB_SHA::12}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/castlink-easy-web:${BUILD_ID}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const owner=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')).repository.owner;
          const response=await fetch(`https://api.github.com/${owner.type==='Organization'?'orgs':'users'}/${owner.login}/packages/container/castlink-easy-web`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(10000)});
          if(response.status!==404&&(!response.ok||(await response.json()).visibility!=='private'))throw Error('Private package prerequisite failed');
          NODE
      - name: Build the immutable Linux amd64 web image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.coordinates.outputs.image }}
          build-args: |
            STUDIOLINK_RELEASE=${{ steps.coordinates.outputs.build_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Observe stock LiveKit and verify all four registry references
        env:
          BUILD_ID: ${{ steps.coordinates.outputs.build_id }}
          WEB_IMAGE: ${{ steps.coordinates.outputs.image }}
          WEB_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir vps-release
          docker buildx imagetools inspect docker.io/livekit/livekit-server:v1.13.7 --format '{{json .Manifest}}' > vps-release/livekit-descriptor.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {validateReleaseManifest} from './apps/cli/dist/bundle.js';
          import {releaseAvailabilityChecks} from './apps/cli/dist/release-availability.js';
          import {LocalExecutor} from './apps/cli/dist/executors/local.js';
          const digest=/^sha256:[a-f0-9]{64}$/;
          const owner=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')).repository.owner;
          const packageResponse=await fetch(`https://api.github.com/${owner.type==='Organization'?'orgs':'users'}/${owner.login}/packages/container/castlink-easy-web`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(10000)});
          if(!packageResponse.ok||(await packageResponse.json()).visibility!=='private')throw Error('Private package visibility unverified');
          const livekit=JSON.parse(readFileSync('vps-release/livekit-descriptor.json','utf8'));
          if(!digest.test(livekit.digest)||!digest.test(process.env.WEB_DIGEST))throw Error('Missing genuine registry digest');
          const image=reference=>({reference,architectures:['amd64']});
          const release={schemaVersion:1,release:process.env.BUILD_ID,nodeVersion:'22.23.3',architectures:['amd64'],images:{
            web:image(process.env.WEB_IMAGE.split(':')[0]+'@'+process.env.WEB_DIGEST),
            postgres:image('docker.io/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea'),
            livekit:image('docker.io/livekit/livekit-server@'+livekit.digest),
            caddy:image('docker.io/library/caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d')}};
          validateReleaseManifest(release,release.release,'amd64');
          const checks=await releaseAvailabilityChecks({manifest:release,release:release.release,architecture:'amd64'},new LocalExecutor(60000));
          if(checks.length!==4||checks.some(c=>c.state!=='pass'))throw Error('Registry identity/platform verification failed');
          const bytes=JSON.stringify(release,null,2)+'\n';
          writeFileSync('vps-release/release.json',bytes,{flag:'wx'});
          writeFileSync('vps-release/admission.json',JSON.stringify({schemaVersion:1,source:process.env.GITHUB_SHA,manifestSHA256:createHash('sha256').update(bytes).digest('hex'),checks,distribution:'private-github-package',deployment:'not-run',services:'not-run',tls:'unverified',media:'unverified'},null,2)+'\n',{flag:'wx'});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: easy-setup-vps-release-${{ github.sha }}
          path: vps-release/
          if-no-files-found: error
          retention-days: 14
