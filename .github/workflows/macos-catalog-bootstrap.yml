name: Refresh macOS source catalog once
on:
  push:
    branches: [ci/macos-catalog-integration-20261102]
permissions:
  contents: read
jobs:
  catalog:
    if: github.repository == 'resokol/castlink' && github.ref == 'refs/heads/ci/macos-catalog-integration-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact reviewed catalog and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = resokol/castlink
          test "$GITHUB_REF" = refs/heads/ci/macos-catalog-integration-20261102
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -- .github/workflows/macos-catalog-bootstrap.yml
          node scripts/build-manual-index.mjs
          git add -- docs/manual/FILE_MAP_RU.md
          test "$(git rev-parse :docs/manual/FILE_MAP_RU.md)" = 0fd7a04f91db7b9bbac02d2fab0a6ccb440ed1a8
          test "$(git write-tree)" = e5ad837fbc88865cf87fbfc53572a1672f745e84
          node scripts/build-manual-index.mjs --check
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "docs: refresh generated macOS source catalog"
          git push origin "HEAD:$GITHUB_REF"
