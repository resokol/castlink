name: Stage verified Windows WSL 1.0.12 files
on:
  push:
    branches: [ops/server-wsl-112-draft]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      FACTORY_RUN: '45963496004'
      FACTORY_SHA: 'af092db44bcd00ead745d23089a04d741cfb4d3e'
      ARTIFACT_ID: '15183600277'
      ARTIFACT_SHA256: 'de5e6e8d317fab1c4c8d0e3b90ba92869bf2f94269a9d5f26c903118f5ea51d1'
      ARTIFACT_SIZE: '3658978266'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify original ZIP digest and the exact factory identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/server-wsl-112/download-candidate.sh
      - name: Check Windows QA against the identical package and verify all draft assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('ops/server-wsl-112')
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'wsl-final-package'
          e=json.loads((p/'native-gate.json').read_bytes())
          assert e['sha']==os.environ['FACTORY_SHA'] and e['run']==os.environ['FACTORY_RUN']
          assert e['sums']==hashlib.sha256((f/'SHA256SUMS').read_bytes()).hexdigest()
          PY
          python3 ops/server-wsl-112/publisher.py draft "$RUNNER_TEMP/wsl-final-package" ops/server-wsl-112/notes.md "$RUNNER_TEMP/stage-receipt.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wsl-112-stage-receipt
          path: ${{ runner.temp }}/stage-receipt.json
          if-no-files-found: error
          retention-days: 7
