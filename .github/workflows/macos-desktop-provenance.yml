name: Private macOS Desktop provenance (no installation)
on:
  workflow_dispatch:
  push:
    branches: [feat/self-hosted-cli-github]
    paths:
      - .github/workflows/macos-desktop-provenance.yml
      - scripts/docker-desktop-macos-provenance.mjs
      - scripts/docker-desktop-macos-pins.json
      - scripts/tests/docker-desktop-macos-provenance.test.mjs
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readonly-provenance:
    if: ${{ github.event.repository.private && github.ref == 'refs/heads/feat/self-hosted-cli-github' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Observe checksum, signature and notarized assessment without executing Docker
        env:
          DESKTOP_ARCH: ${{ matrix.architecture }}
        run: node scripts/docker-desktop-macos-provenance.mjs "$DESKTOP_ARCH" "$RUNNER_TEMP/castlink-desktop-provenance"
      - name: Retain only private bounded typed metadata (never the DMG)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-readonly-desktop-provenance-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/castlink-desktop-provenance/MACOS-DESKTOP-PROVENANCE.json
          if-no-files-found: warn
          retention-days: 7
