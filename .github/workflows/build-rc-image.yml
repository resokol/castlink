name: Build RC image

on:
  workflow_dispatch:
  push:
    tags:
      - "build-rc-*"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read product version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]; then
            echo "Refusing non-RC product version: $VERSION" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_ID="${VERSION}-${SHORT_SHA}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/castlink-web:${BUILD_ID}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable RC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            STUDIOLINK_RELEASE=${{ steps.version.outputs.build_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Publish deployment coordinates
        shell: bash
        run: |
          {
            echo "### CastLink RC image"
            echo ""
            echo "- Product version: `${{ steps.version.outputs.version }}`"
            echo "- Build ID: `${{ steps.version.outputs.build_id }}`"
            echo "- Image: `${{ steps.version.outputs.image }}`"
            echo "- Commit: `${{ github.sha }}`"
            echo ""
            echo "No deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
