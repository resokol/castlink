name: Build RC image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (for example 1.0-integration or release/1.0.0-rc.1)"
        required: true
        default: "1.0-integration"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested ref
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$BUILD_REF" in
            1.0-integration|release/1.0.0-rc.*) ;;
            *)
              echo "Refusing unexpected build ref: $BUILD_REF" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Read product version and checked-out SHA
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]; then
            echo "Refusing non-RC product version: $VERSION" >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA::12}"
          BUILD_ID="${VERSION}-${SHORT_SHA}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/castlink-web:${BUILD_ID}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable RC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            STUDIOLINK_RELEASE=${{ steps.version.outputs.build_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Publish deployment coordinates
        shell: bash
        run: |
          {
            echo "### CastLink RC image"
            echo ""
            echo "- Source ref: `${{ inputs.ref }}`"
            echo "- Product version: `${{ steps.version.outputs.version }}`"
            echo "- Source commit: `${{ steps.version.outputs.source_sha }}`"
            echo "- Build ID: `${{ steps.version.outputs.build_id }}`"
            echo "- Image: `${{ steps.version.outputs.image }}`"
            echo ""
            echo "No deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
