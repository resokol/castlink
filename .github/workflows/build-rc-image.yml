name: Build RC image

on:
  workflow_dispatch:
  push:
    tags:
      - "build-rc-*"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read product version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]; then
            echo "Refusing non-RC product version: $VERSION" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_ID="${VERSION}-${SHORT_SHA}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/castlink-web:${BUILD_ID}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable RC image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            STUDIOLINK_RELEASE=${{ steps.version.outputs.build_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Publish deployment coordinates
        shell: bash
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
          BUILD_ID: ${{ steps.version.outputs.build_id }}
          IMAGE_REF: ${{ steps.version.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            printf '### CastLink RC image\n\n'
            printf -- '- Product version: `%s`\n' "$PRODUCT_VERSION"
            printf -- '- Build ID: `%s`\n' "$BUILD_ID"
            printf -- '- Image: `%s`\n' "$IMAGE_REF"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'No deployment was performed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
