name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDIOLINK_RELEASE: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Stable tests
        run: pnpm test:ci

      - name: Production build
        run: pnpm build

      - name: Version API integration
        shell: bash
        run: |
          pnpm --filter web exec next start -H 127.0.0.1 -p 3001 > /tmp/castlink-next.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/version >/dev/null; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/castlink-next.log
              exit 1
            fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3001 node apps/web/tests/app-update-api.cjs
