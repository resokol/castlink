name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-ssh-dependencies:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned SSH packages in stock Windows PowerShell 5.1
        shell: powershell
        run: |
          & scripts/tests/simple-easy-setup-ssh-packages.fixtures.ps1 -ToolsDir (Join-Path $env:RUNNER_TEMP 'castlink-ssh')

  verify:
    # Keep the validated canonical sudo layout used by the fixed-identity CLI gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: castlink
          POSTGRES_PASSWORD: castlink
          POSTGRES_DB: castlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U castlink -d castlink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STUDIOLINK_RELEASE: ci-${{ github.sha }}
      TEST_DATABASE_URL: postgresql://castlink:castlink@127.0.0.1:5432/castlink_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: CLI tests (ordinary host + actual legacy UID/GID1000 actor)
        run: |
          pnpm --filter @castlink/cli build
          node scripts/tests/test-cli-ci.test.mjs
          node scripts/test-cli-ci.mjs --ci-fixed-private-control

      - name: Stable tests
        run: pnpm test:ci

      - name: Release channels, install policy and publication destinations
        run: node --test scripts/tests/installer-channel-policy.test.mjs scripts/tests/release-tracks.test.cjs scripts/tests/release-destination.test.cjs scripts/tests/release-draft-id.test.cjs scripts/tests/package-simple-easy-setup.test.mjs

      - name: Local public asset preparation
        run: node --test scripts/tests/prepare-public-assets.test.mjs

      - name: Standalone Linux installer
        run: |
          python3 -B scripts/tests/linux-server-recovery.test.py
          python3 -B scripts/tests/linux-compose-setup.test.py
          python3 -B scripts/tests/linux-updates.test.py
          python3 -B scripts/tests/linux-parent-images.test.py
          python3 -B scripts/tests/simple-easy-setup-retention-worker.test.py
          node --test scripts/tests/server-provision-vps-retention.test.mjs

      - name: Server pairing recovery and HTTPS
        run: node --test scripts/tests/server-profile-store.test.mjs scripts/tests/server-recovery-store.test.mjs scripts/tests/server-recovery-client.test.mjs scripts/tests/server-peer-request.test.mjs

      - name: Isolated presentation converter
        run: |
          python3 -B -m unittest discover -s scripts/presentation-converter -p 'test_*.py'
          python3 -B scripts/tests/presentation-converter-compose.test.py
          node --test scripts/tests/presentation-upload-runtime.test.cjs

      - name: PostgreSQL storage integration
        run: |
          node apps/web/tests/postgres-room-store.cjs
          node apps/web/tests/postgres-import-rooms.cjs
          node apps/web/tests/control-plane-postgres.cjs
          node --test apps/web/tests/setup-database-postgres.cjs
          node --test apps/web/tests/setup-owner-postgres.cjs
          node --test apps/web/tests/setup-observe-postgres.cjs
          node apps/web/tests/control-plane-seed.cjs
          node apps/web/tests/control-plane-store.cjs
          node apps/web/tests/studio-owner-access-postgres.cjs
          node apps/web/tests/control-plane-register-node.cjs
          node apps/web/tests/multitenant-room-isolation.cjs
          node apps/web/tests/platform-access-postgres.cjs

      - name: Production build
        run: pnpm build

      - name: Node operations integration (isolated signalling)
        shell: bash
        run: |
          set -euo pipefail
          QA_DIR="$(mktemp -d)"
          cleanup() { docker rm -f castlink-ops-qa-caddy castlink-ops-qa-livekit >/dev/null 2>&1 || true; rm -rf "$QA_DIR"; }
          trap cleanup EXIT
          cat > "$QA_DIR/Caddyfile" <<'CADDY'
          {
            auto_https off
            admin off
          }
          http://127.0.0.1:17882 {
            route {
              forward_auth 127.0.0.1:3113 {
                uri /api/media-admission
                header_up -Upgrade
                header_up -Connection
              }
              reverse_proxy 127.0.0.1:17880
            }
          }
          CADDY
          docker run -d --name castlink-ops-qa-livekit --network host livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20 --dev --bind 127.0.0.1 --port 17880
          docker run -d --name castlink-ops-qa-caddy --network host -v "$QA_DIR/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
          for attempt in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:17880; then break; fi
            sleep 1
          done
          node apps/web/tests/node-operations-postgres.cjs

      - name: Version API integration
        shell: bash
        env:
          STUDIOLINK_DATA_DIR: /tmp/castlink-ci-data
        run: |
          pnpm --filter web exec next start -H 127.0.0.1 -p 3001 > /tmp/castlink-next.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/version >/dev/null; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/castlink-next.log
              exit 1
            fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3001 node apps/web/tests/app-update-api.cjs

