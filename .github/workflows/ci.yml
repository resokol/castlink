name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: castlink
          POSTGRES_PASSWORD: castlink
          POSTGRES_DB: castlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U castlink -d castlink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STUDIOLINK_RELEASE: ci-${{ github.sha }}
      TEST_DATABASE_URL: postgresql://castlink:castlink@127.0.0.1:5432/castlink_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Stable tests
        run: pnpm test:ci

      - name: PostgreSQL storage integration
        run: |
          node apps/web/tests/postgres-room-store.cjs
          node apps/web/tests/postgres-import-rooms.cjs
          node apps/web/tests/control-plane-postgres.cjs
          node apps/web/tests/control-plane-seed.cjs

      - name: Production build
        run: pnpm build

      - name: Version API integration
        shell: bash
        env:
          STUDIOLINK_DATA_DIR: /tmp/castlink-ci-data
        run: |
          pnpm --filter web exec next start -H 127.0.0.1 -p 3001 > /tmp/castlink-next.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/version >/dev/null; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/castlink-next.log
              exit 1
            fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3001 node apps/web/tests/app-update-api.cjs
