name: Windows desktop client candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: [self-hosted, Windows, castlink]
    defaults:
      run:
        # Use the built-in identifier: runner supplies .ps1 and propagates native exit codes.
        # Do not discover optional pwsh through stale user PATH entries.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @castlink/desktop test
      - run: pnpm typecheck
      - run: pnpm --filter @castlink/desktop package:win
      - uses: actions/upload-artifact@v4
        with:
          name: CastLink-Windows-Client-Candidate
          path: artifacts/desktop/**
          if-no-files-found: error
