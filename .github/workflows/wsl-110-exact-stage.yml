name: Stage verified Windows WSL 1.0.10 files
on:
  push:
    branches: [ops/server-wsl-110-draft]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      FACTORY_RUN: '45805347165'
      FACTORY_SHA: '890a903d51f910b360e414ed9d13d32885ee4db0'
      ARTIFACT_ID: '15109983164'
      ARTIFACT_SHA256: 'b622b429b963db3fa24f4ccc29dcd51b71222510762a74ce97ace58208caa375'
      ARTIFACT_SIZE: '3658967446'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify original ZIP digest and the exact factory identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/server-wsl-110/download-candidate.sh
      - name: Check Windows QA against the identical package and verify all draft assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('ops/server-wsl-110')
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'wsl-final-package'
          e=json.loads((p/'native-gate.json').read_bytes())
          assert e['sha']==os.environ['FACTORY_SHA'] and e['run']==os.environ['FACTORY_RUN']
          assert e['sums']==hashlib.sha256((f/'SHA256SUMS').read_bytes()).hexdigest()
          PY
          python3 ops/server-wsl-110/publisher.py draft "$RUNNER_TEMP/wsl-final-package" ops/server-wsl-110/notes.md "$RUNNER_TEMP/stage-receipt.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wsl-110-stage-receipt
          path: ${{ runner.temp }}/stage-receipt.json
          if-no-files-found: error
          retention-days: 7
