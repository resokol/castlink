appId: ru.castlink.client
productName: CastLink Client
asar: true
protocols:
  - name: CastLink invitation
    schemes:
      - castlink
files:
  - src/*.cjs
  - ui/*
  - assets/*
  - package.json
  - build-info.json
  - LICENSE
  - THIRD_PARTY_NOTICES
win:
  icon: assets/castlink-icon.ico
  target:
    - zip
    - nsis
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: CastLink Client
publish: null
