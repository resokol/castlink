appId: ru.castlink.client
productName: CastLink Client
asar: true
protocols:
  - name: CastLink invitation
    schemes:
      - castlink
  - name: CastLink presentation component
    schemes:
      - castlink-presenter
files:
  - src/*.cjs
  - ui/*
  - assets/*
  - package.json
  - build-info.json
  - LICENSE
  - THIRD_PARTY_NOTICES
win:
  icon: assets/castlink-icon.ico
  target:
    - zip
    - nsis
  signAndEditExecutable: true
nsis:
  installerLanguages:
    - en_US
    - ru_RU
    - zh_CN
  include: build/installer.nsh
  installerSidebar: build/installer-sidebar.bmp
  uninstallerSidebar: build/installer-sidebar.bmp
  installerHeader: build/installer-header.bmp
  installerIcon: assets/castlink-icon.ico
  uninstallerIcon: assets/castlink-icon.ico
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: CastLink Client
publish: null
