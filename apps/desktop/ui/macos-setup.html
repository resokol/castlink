<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><title>CastLink Server Setup</title><link rel="stylesheet" href="macos-setup.css"></head><body><main><header><span class="brand">CastLink</span><select id="locale" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></header><h1 id="title"></h1><p data-t="intro"></p><form id="setup"><fieldset id="fields"><section><label><span data-t="target"></span><select id="target"><option value="local" data-t="local"></option><option value="ssh" data-t="ssh"></option></select></label><label><span data-t="folder"></span><span class="row"><input id="folder" required autocomplete="off"><button id="browse" type="button" data-t="browse"></button></span></label><p class="hint" data-t="folderHint"></p><div id="ssh-fields" hidden><p data-t="ubuntu"></p><div class="columns"><label><span data-t="host"></span><input id="host" autocomplete="off"></label><label><span data-t="port"></span><input id="port" type="number" min="1" max="65535" value="22"></label></div><button id="probe" type="button" data-t="probe"></button><output id="fingerprint"></output><label class="check"><input id="host-confirm" type="checkbox"><span data-t="hostConfirm"></span></label><label><span data-t="auth"></span><select id="auth"><option value="password" data-t="passwordAuth"></option><option value="private-key" data-t="keyAuth"></option></select></label><label id="password-field"><span data-t="password"></span><input id="password" type="password" autocomplete="off"></label><div id="key-fields" hidden><label><span data-t="key"></span><textarea id="key" rows="5" autocomplete="off" spellcheck="false"></textarea></label><label><span data-t="passphrase"></
