services:
  postgres:
    image: postgres:16-alpine
    container_name: castlink-postgres
    restart: unless-stopped
    env_file:
      - ./postgres.env
    volumes:
      - ${CASTLINK_POSTGRES_DATA_DIR:-/opt/studiolink/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castlink} -d ${POSTGRES_DB:-castlink}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${CASTLINK_WEB_IMAGE:?CASTLINK_WEB_IMAGE must be an immutable image tag or digest}
    container_name: studiolink-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./web.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STUDIOLINK_DATA_DIR: /data
    volumes:
      - ${CASTLINK_DATA_DIR:-/opt/studiolink/data}:/data
    ports:
      - "127.0.0.1:${CASTLINK_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
