global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 2h
  timeout server 2h

frontend tls_mux
  bind ":443"
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend turn_tls if { req.ssl_sni -i turn.castlink.ru }
  default_backend caddy_https

backend caddy_https
  server caddy 127.0.0.1:8443 send-proxy-v2 check

backend turn_tls
  server livekit 127.0.0.1:5349 check send-proxy-v2
