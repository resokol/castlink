global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 1m
  timeout server 1m

frontend tls_mux_test
  bind "127.0.0.1:9443"
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend turn_tls if { req.ssl_sni -i turn.castlink.ru }
  default_backend caddy_https

backend caddy_https
  server caddy 127.0.0.1:443 check

backend turn_tls
  server livekit 127.0.0.1:5349 check
