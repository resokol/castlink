model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[agents.backend]
description = "API, access control, room state, invites, telemetry and server-side business logic."
config_file = "agents/backend.toml"

[agents.frontend]
description = "Pages, components, responsive design, browser audio/video and client WebRTC."
config_file = "agents/frontend.toml"

[agents.sysadmin]
description = "Servers, networks, DNS/TLS, LiveKit connectivity, Docker/systemd, releases, backups and disk usage."
config_file = "agents/sysadmin.toml"
